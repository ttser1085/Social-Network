services:
    auth:
        build: 
            context: auth
        depends_on:
            - users_db
        ports:
            - 8091:8091
    
    posts:
        build: 
            context: posts
        depends_on:
            - posts_db
        ports:
            - 8093:8093

    grpc-gateway:
        build: 
            context: grpc-gateway
        depends_on:
            - posts
        ports:
            - 8094:8094
    
    stats:
        build: 
            context: stats
        depends_on:
            - clickhouse
        ports:
            - 8095:8095
    
    stats-gateway:
        build: 
            context: stats-gateway
        depends_on:
            - stats
        ports:
            - 8096:8096
    
    gateway:
        build: 
            context: gateway
        depends_on:
            - auth
        ports:
            - 8092:8092
    
    users_db:
        image: postgres:latest
        restart: always
        environment:
            POSTGRES_USER: auth
            POSTGRES_PASSWORD: password
            POSTGRES_DB: usersdb
        ports:
            - 5432:5432
        command: -p 5432

    clickhouse:
        image: clickhouse/clickhouse-server:latest
        environment:
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: mysecret
            CLICKHOUSE_DB: default
        ports:
            - "8123:8123"   # HTTP API
            - "9000:9000"   # Native protocol (TCP)
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        ulimits:
            nofile:
                soft: 262144
                hard: 262144

    posts_db:
        image: postgres:latest
        restart: always
        environment:
            POSTGRES_USER: posts
            POSTGRES_PASSWORD: password
            POSTGRES_DB: postsdb
        ports:
            - 5433:5433
        command: -p 5433
    
    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
    
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    kafdrop:
        image: obsidiandynamics/kafdrop
        ports:
        - "9001:9000"
        environment:
            KAFKA_BROKER_CONNECT: kafka:9092
        depends_on:
            - kafka
    
    tests:
        build:
            context: tests
    

volumes:
    clickhouse_data:
